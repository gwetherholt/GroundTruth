[package]
name = "groundtruth-validator-cli"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
description = "CLI demonstrating groundtruth-validator on arbitrary CSV data"

[[bin]]
name = "gt-validate"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
groundtruth-validator = { path = "../groundtruth-validator" }
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
chrono = { workspace = true }
serde = { workspace = true }
serde_json = "1"
colored = "2.1"
anyhow = "1"

[dev-dependencies]
tempfile = "3"
