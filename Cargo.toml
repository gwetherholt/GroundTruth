[workspace]
resolver = "2"
members = ["groundtruth-validator", "groundtruth-validator-cli", "server"]

[workspace.package]
edition = "2021"
authors = ["Georgia Wetherholt <gwetherholt@gmail.com>"]

[workspace.dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
